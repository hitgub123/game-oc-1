<script>
// ================================================================
//  〇、Web Audio API 音效系统 (v5)
// ================================================================
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playSound(type) {
  if (!audioCtx) return;
  try {
    const t = audioCtx.currentTime;
    switch(type) {
      case 'shoot': {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(880, t);
        osc.frequency.exponentialRampToValueAtTime(440, t + 0.1);
        gain.gain.setValueAtTime(0.15, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
        osc.start(t);
        osc.stop(t + 0.1);
        break;
      }
      case 'explosion': {
        const bufferSize = audioCtx.sampleRate * 0.15;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
        }
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        source.connect(gain);
        gain.connect(audioCtx.destination);
        source.start(t);
        break;
      }
      case 'power': {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523, t);
        osc.frequency.exponentialRampToValueAtTime(1047, t + 0.15);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        osc.start(t);
        osc.stop(t + 0.15);
        break;
      }
      case 'bomb': {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, t);
        osc.frequency.exponentialRampToValueAtTime(30, t + 0.4);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
        osc.start(t);
        osc.stop(t + 0.4);
        break;
      }
      case 'hit': {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, t);
        osc.frequency.exponentialRampToValueAtTime(50, t + 0.15);
        gain.gain.setValueAtTime(0.25, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        osc.start(t);
        osc.stop(t + 0.15);
        break;
      }
      case 'gameover': {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, t);
        osc.frequency.exponentialRampToValueAtTime(110, t + 0.8);
        gain.gain.setValueAtTime(0.25, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
        osc.start(t);
        osc.stop(t + 0.8);
        break;
      }
      case 'clear': {
        const notes = [523, 659, 784, 1047];
        notes.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t + i * 0.12);
          gain.gain.setValueAtTime(0.15, t + i * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.12 + 0.3);
          osc.start(t + i * 0.12);
          osc.stop(t + i * 0.12 + 0.3);
        });
        break;
      }
      case 'convert': {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(660, t);
        osc.frequency.exponentialRampToValueAtTime(330, t + 0.2);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        osc.start(t);
        osc.stop(t + 0.2);
        break;
      }
    }
  } catch(e) {}
}

// ================================================================
//  一、常量与配置（v2 扩展）
// ================================================================
const CONFIG = {
  // 画布
  CANVAS_W: 800,
  CANVAS_H: 600,

  // 玩家（"子机"）
  PLAYER_RADIUS: 14,
  PLAYER_SPEED: 3.5,
  PLAYER_MAX_HP: 100,
  MAX_LIVES: 10,
  MAX_BOMBS: 10,
  INITIAL_LIVES: 3,
  INITIAL_BOMBS: 2,

  // 受伤 (v3: 40%)
  HP_LOSS: 40,
  DAMAGE_INTERVAL: 1500,

  // 子弹 (v3 主/副分离, v3.2 副子弹追踪+半速)
  BULLET_RADIUS: 5,             // 主子弹半径
  BULLET_SPEED: 5,              // 主子弹速度
  SUB_BULLET_SPEED: 2.5,        // v3.2: 副子弹速度 = 主子弹一半
  BULLET_LIFE: 120,
  MAIN_BULLET_DMG: 1,           // v3: 主子弹伤害
  SUB_BULLET_DMG: 0.5,          // v3: 副子弹伤害
  SUB_BULLET_RADIUS: 4,         // v3: 副子弹半径
  SUB_BULLET_COLOR: '#44aaff',  // v3: 副子弹颜色
  AUTO_FIRE_INTERVAL: 1000,

  // 子弹扇形 (v3 调整)
  BULLET_SPREAD_ANGLE: 15,      // 每颗副子弹间隔角度
  BULLET_SPREAD_MAX: 45,        // 最大扇形跨度（度）

  // Power (v3: 自动飞向玩家)
  MAX_POWER: 5,
  POWER_PER_ITEM: 0.1,
  POWER_ITEM_DROP_RATE: 0.5,
  // 敌人
  ENEMY_RADIUS: 10,
  ENEMY_SPEED: 0.8,
  ENEMY_SPAWN_INTERVAL_MIN: 300,   // v3.2: 最快（60秒后）
  ENEMY_SPAWN_INTERVAL_MAX: 1000,  // v3.2: 最慢（开局）
  ENEMY_SPAWN_RAMP_DURATION: 60,   // v3.2: 渐变到最快所需秒数
  ENEMY_MAX: 50,

  // 敌人解锁分数 (v6: 降低门槛，前期更有趣)
  UNLOCK_SCORE_BUTTERFLY: 100,
  UNLOCK_SCORE_CROW: 300,
  UNLOCK_SCORE_MINI_BOSS: 800,

  // Bomb
  BOMB_BULLET_COUNT: 20,
  BOMB_BULLET_RADIUS: 7,
  BOMB_BULLET_SPEED: 13.5,  // v4: 3倍速度
  BOMB_INVINCIBLE_TIME: 1000,
  BOMB_ANIMATION_DURATION: 1000,
  BOMB_DEATH_SAVE_INVINCIBLE: 1000, // v3: 防死后无敌时长

  // 副子弹 (v5)
  MAX_SUB_BULLETS: 4,        // v5: 副子弹最大数量
  BOMB_DAMAGE: 2,            // v5: Bomb 造成伤害
  BOMB_SCORE_MULT: 2,        // v5: 击杀分数倍率

  // 分数
  SCORE_PER_ENEMY: 1,
  SCORE_TO_CLEAR: 2000,
  SCORE_FOR_LIFE: 500,
  SCORE_FOR_BOMB: 200,
};

// v5: 敌人分数
const ENEMY_SCORES = {
  fuzzy: 1,
  butterfly: 2,
  crow: 4,
  mini_boss: 10,
  big_boss: 100,
};

// 敌人类型配置表
const ENEMY_TYPES = {
  fuzzy:     { color: '#33dd55', stroke: '#88ff88', hp: 1,  speedMult: 1.0, radius: 10, prob: 0.50 },
  butterfly: { color: '#cc66ff', stroke: '#ff99ff', hp: 1,  speedMult: 1.6, radius: 10, prob: 0.25 },
  crow:      { color: '#222233', stroke: '#666666', hp: 2,  speedMult: 1.4, radius: 12, prob: 0.20 },
  mini_boss: { color: '#ffaa00', stroke: '#ffddaa', hp: 10, speedMult: 0.3, radius: 24, prob: 0.05 },
  big_boss:  { color: '#cc2233', stroke: '#ffddaa', hp: 100,speedMult: 0.2, radius: 40, prob: 0 },
};

// ================================================================
//  二、游戏状态机（新增 CLEAR）
// ================================================================
//  状态转移：
//
//    LOADING  →  PLAYING  →  GAME_OVER
//                  │
//                  ↓
//                CLEAR  (得分 ≥ 2000)
//                  │
//                  ↓ (按 R)
//                PLAYING
//
const STATE = {
  LOADING:   'LOADING',
  PLAYING:   'PLAYING',
  PAUSED:    'PAUSED',
  GAME_OVER: 'GAME_OVER',
  CLEAR:     'CLEAR',
};

// ================================================================
//  三、Canvas 与 DOM 引用
// ================================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreDisplay = document.getElementById('scoreDisplay');
const livesDisplay = document.getElementById('livesDisplay');
const bombsDisplay = document.getElementById('bombsDisplay');
const powerDisplay = document.getElementById('powerDisplay');
const hpDisplay = document.getElementById('hpDisplay');
const fpsDisplay = document.getElementById('fpsDisplay');
const bgSelect = document.getElementById('bgSelect');  // v5.1: 背景切换

// ================================================================
//  四、核心游戏对象
// ================================================================
const game = {
  // --- 状态机 ---
  state: STATE.LOADING,
  prevState: null,
  stateTimer: 0,

  // --- 游戏数据 ---
  score: 0,
  lives: CONFIG.INITIAL_LIVES,
  bombs: CONFIG.INITIAL_BOMBS,
  power: 0,                         // v2 Power 值 [0, 5]
  scoreForNextLife: CONFIG.SCORE_FOR_LIFE,
  scoreForNextBomb: CONFIG.SCORE_FOR_BOMB,
  isBombActive: false,
  bombAnimStartTime: 0,
  bonusMessages: [],
  frameCount: 0,

  // --- 对象容器 ---
  player: null,
  enemies: [],
  enemyBullets: [],
  bullets: [],
  particles: [],
  // --- v3.2: 时间基准（替代 setInterval）---
  startTime: 0,            // 游戏开始时间（毫秒）
  lastSpawnTime: 0,        // 上次敌人生成时间

  // --- v5.1: 大 boss ---
  bigBossSpawned: false,

  // --- v5.1: 当前背景 ---
  currentBg: 'waterfall',

  // --- v8: Bomb 持续状态 ---
  bombEndTime: 0,        // bomb 结束时间
  bombType: null,         // bomb 类型 ('reimu'|'marisa'|'sanae')
  bombDamageTimer: 0,     // bomb 伤害计时器

  // --- v6: Debug 模式 ---
  debugMode: false,

  // --- v7: 角色选择 ---
  currentChar: 'reimu',

  // --- v12: 难度选择 ---
  difficulty: 'normal',

  // --- v7: 辅助子机 ---
  companions: [],

  // --- v7: 激光系统 ---
  lasers: [],

  // --- FPS ---
  fps: 0,
  _fpsFrames: 0,
  _fpsLastTime: 0,
};

// ================================================================
//  五、辅助工具函数
// ================================================================

/** 两点距离 */
function dist(x1, y1, x2, y2) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  return Math.sqrt(dx * dx + dy * dy);
}

/** [min, max) 随机整数 */
function randInt(min, max) {
  return Math.floor(Math.random() * (max - min)) + min;
}

/** 数值钳制 */
function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

/** v3.2: 根据游戏已用时间计算当前敌人生成间隔（线性渐变），难度系数调整 */
function getCurrentSpawnInterval() {
  if (!game.startTime) return CONFIG.ENEMY_SPAWN_INTERVAL_MAX;
  const elapsed = (performance.now() - game.startTime) / 1000;
  const t = Math.min(elapsed / CONFIG.ENEMY_SPAWN_RAMP_DURATION, 1);
  const base = CONFIG.ENEMY_SPAWN_INTERVAL_MAX - t * (CONFIG.ENEMY_SPAWN_INTERVAL_MAX - CONFIG.ENEMY_SPAWN_INTERVAL_MIN);
  const diffMult = { easy: 2.0, normal: 1.0, hard: 0.6, lunatic: 0.4 }[game.difficulty] || 1.0;
  return base * diffMult;
}

// ================================================================
//  六、游戏对象工厂
// ================================================================

/**
 * 创建玩家（"子机"）
 * - 新增 hp / maxHp 字段
 */
function createPlayer() {
  return {
    x: CONFIG.CANVAS_W / 2,
    y: CONFIG.CANVAS_H - 60,
    radius: CONFIG.PLAYER_RADIUS,
    hp: CONFIG.PLAYER_MAX_HP,
    maxHp: CONFIG.PLAYER_MAX_HP,
    invincibleUntil: 0,
    keys: { w: false, a: false, s: false, d: false },
  };
}

/** 获取敌人类型配置 */
function getEnemyConfig(type) {
  return ENEMY_TYPES[type] || ENEMY_TYPES.fuzzy;
}

/** 获取敌人颜色 */
function getEnemyColor(type) {
  return getEnemyConfig(type).color;
}

/**
 * v3: 根据当前分数返回可用的敌人类型
 */
function getAvailableEnemyTypes(score) {
  const types = ['fuzzy'];
  if (score >= CONFIG.UNLOCK_SCORE_BUTTERFLY) types.push('butterfly');
  if (score >= CONFIG.UNLOCK_SCORE_CROW) types.push('crow');
  if (score >= CONFIG.UNLOCK_SCORE_MINI_BOSS) types.push('mini_boss');
  if (score >= 1800 && !game.bigBossSpawned) types.push('big_boss');
  return types;
}

/**
 * 创建敌人 — 母敌人从边缘生成，上半屏巡逻
 */
function createEnemy() {
  const available = getAvailableEnemyTypes(game.score);
  const availableProbs = available.map(t => ENEMY_TYPES[t].prob);
  const totalProb = availableProbs.reduce((a, b) => a + b, 0);
  const r = Math.random() * totalProb;
  let cumulative = 0, type = available[0];
  for (let i = 0; i < available.length; i++) {
    cumulative += availableProbs[i];
    if (r < cumulative) { type = available[i]; break; }
  }

  if (type === 'big_boss') game.bigBossSpawned = true;

  const cfg = ENEMY_TYPES[type];

  // 从边缘生成，左右只在上半屏
  const side = randInt(0, 3);
  let x, y;
  switch (side) {
    case 0: x = randInt(0, CONFIG.CANVAS_W); y = -cfg.radius - 5; break;
    case 1: x = CONFIG.CANVAS_W + cfg.radius + 5; y = randInt(0, CONFIG.CANVAS_H * 0.4); break;
    case 2: x = -cfg.radius - 5; y = randInt(0, CONFIG.CANVAS_H * 0.4); break;
  }

  return {
    x, y, type, radius: cfg.radius, hp: cfg.hp, maxHp: cfg.hp,
    speed: CONFIG.ENEMY_SPEED * cfg.speedMult,
    vx: 0, vy: 0,
    phase: Math.random() * Math.PI * 2,
    hitFlash: 0,
    shootTimer: 0,
    walkDir: Math.random() > 0.5 ? 1 : -1,
    isBoss: type === 'big_boss',
  };
}

// v4: 5 种副子弹颜色（不含黄色，区分敌人子弹）
const SUB_COLORS = ['#44aaff', '#00cccc', '#44ff44', '#cc44ff', '#ff6666', '#ff8800'];

/**
 * 创建子弹（v3: 主/副分离，isMain 参数；v4: subIndex 对应颜色）
 */
function createBullet(angle, isMain = true, subIndex = -1) {
  const speed = isMain ? CONFIG.BULLET_SPEED : CONFIG.SUB_BULLET_SPEED;
  const color = isMain ? '#ff6633' : SUB_COLORS[subIndex % SUB_COLORS.length];
  return {
    x: game.player.x,
    y: game.player.y,
    radius: isMain ? CONFIG.BULLET_RADIUS : CONFIG.SUB_BULLET_RADIUS,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    life: CONFIG.BULLET_LIFE,
    damage: isMain ? CONFIG.MAIN_BULLET_DMG : CONFIG.SUB_BULLET_DMG,
    isMain: isMain,
    color: color,
  };
}

  /**
 * 创建爆炸粒子特效
 */
function createExplosion(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    game.particles.push({
      x, y,
      radius: 2 + Math.random() * 3,
      color,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 30 + randInt(0, 20),
      maxLife: 50,
    });
  }
}

// ================================================================
//  七、状态机 —— 状态进入 / 退出
// ================================================================

/** 进入 PLAYING — 重置所有游戏数据 */
function enterPlaying() {
  game.score = 0;
  game.lives = CONFIG.INITIAL_LIVES;
  game.bombs = CONFIG.INITIAL_BOMBS;
  game.power = game.debugMode ? 5 : 0;
  game.scoreForNextLife = CONFIG.SCORE_FOR_LIFE;
  game.scoreForNextBomb = CONFIG.SCORE_FOR_BOMB;
  game.isBombActive = false;
  game.bombEndTime = 0;
  game.bombType = null;
  game.bombDamageTimer = 0;
  game.bonusMessages = [];
  game.frameCount = 0;
  game.enemies = [];
  game.enemyBullets = [];
  game.bullets = [];
  game.particles = [];
  game.player = createPlayer();

  // v3.2: 设置时间基准（用于动态敌人生成）
  game.startTime = performance.now();
  game.lastSpawnTime = performance.now();

  // v5.1: 重置大 boss 状态
  game.bigBossSpawned = false;

  // v7: 重置辅助子机和激光
  game.companions = [];
  game.lasers = [];

  // 开局立即生成 3 个敌人
  for (let i = 0; i < 3; i++) {
    game.enemies.push(createEnemy());
  }
}

/** 进入 GAME_OVER */
function enterGameOver() {
  playSound('gameover');
  // v3.2: 已改用主循环时间检查，无需清理 setInterval
}

/** 进入 CLEAR */
function enterClear() {
  playSound('clear');
  // v3.2: 已改用主循环时间检查，无需清理 setInterval
}

/** 状态机核心调度 — 每帧调用 */
function updateStateMachine() {
  const current = game.state;

  // 首帧 LOADING → PLAYING
  if (game.prevState === null) {
    if (current === STATE.LOADING) {
      game.state = STATE.PLAYING;
      enterPlaying();
    }
    game.prevState = current;
    return;
  }

  // PLAYING → GAME_OVER（命归零）
  if (current === STATE.PLAYING && game.lives <= 0) {
    game.state = STATE.GAME_OVER;
    enterGameOver();
  }

  // v5.1: 杀死大 boss 才通关（不再看分数）
  //（通关触发在 checkCollisions 中）

  game.prevState = game.state;
}

document.addEventListener('keydown', (e) => {
  initAudio();  // v5: 首次交互时初始化 AudioContext
  const key = e.key.toLowerCase();

  // WASD 移动
  if (['w', 'a', 's', 'd'].includes(key)) {
    e.preventDefault();
    if (game.player) game.player.keys[key] = true;
  }

  // C 键：power 转 bomb
  if (key === 'c' && game.state === STATE.PLAYING) {
    e.preventDefault();
    convertPowerToBomb();
  }

  // Bomb 按键（X 或 空格）
  if ((key === 'x' || key === ' ') && game.state === STATE.PLAYING) {
    e.preventDefault();
    useBomb();
  }

  // ESC：暂停/继续
  if (key === 'escape') {
    if (game.state === STATE.PLAYING) {
      game.state = STATE.PAUSED;
    } else if (game.state === STATE.PAUSED) {
      game.state = STATE.PLAYING;
    }
  }

  // GAME_OVER / CLEAR / PAUSED 下按 R 重开
  if (key === 'r' && (game.state === STATE.GAME_OVER || game.state === STATE.CLEAR || game.state === STATE.PAUSED)) {
    game.state = STATE.PLAYING;
    enterPlaying();
  }
});

document.addEventListener('keyup', (e) => {
  const key = e.key.toLowerCase();
  if (['w', 'a', 's', 'd'].includes(key)) {

});

// ================================================================
//  九、游戏逻辑更新（每帧调用）
// ================================================================

/**
 * 更新玩家位置（WASD + 边界限制）
 */
function updatePlayer() {
  const p = game.player;
  if (!p) return;

  let dx = 0, dy = 0;
  if (p.keys.w) dy -= 1;
  if (p.keys.s) dy += 1;
  if (p.keys.a) dx -= 1;
  if (p.keys.d) dx += 1;

  // 对角线归一化
  if (dx !== 0 && dy !== 0) {
    const inv = 1 / Math.SQRT2;
    dx *= inv;
    dy *= inv;
  }

  p.x += dx * CONFIG.PLAYER_SPEED;
  p.y += dy * CONFIG.PLAYER_SPEED;

  p.x = clamp(p.x, p.radius, CONFIG.CANVAS_W - p.radius);
  p.y = clamp(p.y, p.radius, CONFIG.CANVAS_H - p.radius);
}

let lastFireTime = 0;

// ================================================================
//  v7: 辅助子机系统
// ================================================================

function updateCompanions() {
  const p = game.player;
  if (!p) return;

  const subCount = Math.min(CONFIG.MAX_SUB_BULLETS, Math.floor(game.debugMode ? 5 : game.power));

  game.companions = [];
  for (let i = 0; i < subCount; i++) {
    // 所有角色：子机在两侧，y坐标相同
    const side = i % 2 === 0 ? -1 : 1;
    const row = Math.floor(i / 2);
    const cx = p.x + side * (30 + row * 20);
    const cy = p.y;

    game.companions.push({ x: cx, y: cy, radius: 6 });
  }
}

function drawCompanions() {
  for (const c of game.companions) {
    ctx.fillStyle = '#88ccff';
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#4488ff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
    ctx.stroke();
  }
}

// ================================================================
//  v7: 激光系统
// ================================================================

function updateLasers() {
  for (let i = game.lasers.length - 1; i >= 0; i--) {
    const l = game.lasers[i];
    l.life--;
    if (l.life <= 0) {
      game.lasers.splice(i, 1);
    }
  }
}

function drawLasers() {
  for (const l of game.lasers) {
    const alpha = l.life / l.maxLife;
    ctx.strokeStyle = `rgba(100, 200, 255, ${alpha * 0.8})`;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(l.x, l.y);
    ctx.lineTo(l.x + Math.cos(l.angle) * l.length, l.y + Math.sin(l.angle) * l.length);
    ctx.stroke();

    // 激光碰撞检测 - 检查激光路径上的点
    const steps = Math.floor(l.length / 10);
    for (let s = 0; s < steps; s++) {
      const t = s / steps;
      const lx = l.x + Math.cos(l.angle) * l.length * t;
      const ly = l.y + Math.sin(l.angle) * l.length * t;
      
      for (const e of game.enemies) {
        if (dist(lx, ly, e.x, e.y) < e.radius + 5) {
          e.hp -= l.damage * 0.1;
          if (e.hp <= 0) {
            const baseScore = ENEMY_SCORES[e.type] || 1;
            game.score += baseScore;
            createExplosion(e.x, e.y, getEnemyColor(e.type), 8);
            onEnemyKilled(e);
            game.enemies.splice(game.enemies.indexOf(e), 1);
          }
        }
      }
    }
  }
}

/**
 * v7: 自动瞄准射击 — 每个角色不同副子弹行为
 */
function autoFire(now) {
  const p = game.player;
  if (!p) return;
  if (game.enemies.length === 0) return;

  let subCount = Math.min(CONFIG.MAX_SUB_BULLETS, Math.floor(game.debugMode ? 5 : game.power));
  // 灵梦 bomb 期间 ×3
  if (game.isBombActive && game.bombType === 'reimu') {
    subCount = Math.min(CONFIG.MAX_SUB_BULLETS, subCount * 3);
  }

  // 找最近敌人
  const sortedEnemies = [...game.enemies].sort((a, b) => {
    return dist(p.x, p.y, a.x, a.y) - dist(p.x, p.y, b.x, b.y);
  });

  // 主子弹（所有角色相同）
  if (sortedEnemies[0]) {
    const angle = Math.atan2(sortedEnemies[0].y - p.y, sortedEnemies[0].x - p.x);
    game.bullets.push(createBullet(angle, true));
    // 灵梦 bomb：额外发射 2 颗主子弹
    if (game.isBombActive && game.bombType === 'reimu') {
      for (let i = 0; i < 2; i++) {
        const extraAngle = angle + (i - 0.5) * 0.2;
        game.bullets.push(createBullet(extraAngle, true));
      }
    }
  }

  // 根据角色发射不同副子弹
  if (game.currentChar === 'reimu') {
    // 灵梦：从辅助子机发射追踪副子弹
    for (let i = 0; i < subCount; i++) {
      const c = game.companions[i];
      if (!c) continue;
      const target = sortedEnemies[i + 1] || sortedEnemies[0];
      if (target) {
        const angle = Math.atan2(target.y - c.y, target.x - c.x);
        const speed = CONFIG.SUB_BULLET_SPEED;
        game.bullets.push({
          x: c.x, y: c.y,
          radius: CONFIG.SUB_BULLET_RADIUS,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: CONFIG.BULLET_LIFE,
          damage: CONFIG.SUB_BULLET_DMG,
          isMain: false,
          color: SUB_COLORS[i % SUB_COLORS.length],
        });
      }
    }
  } else if (game.currentChar === 'marisa') {
    // 魔理沙：贯通激光（延伸到屏幕顶部）
    for (let i = 0; i < subCount; i++) {
      const c = game.companions[i];
      if (c) {
        game.lasers.push({
          x: c.x, y: c.y,
          angle: -Math.PI / 2,
          length: CONFIG.CANVAS_H,
          damage: CONFIG.SUB_BULLET_DMG * 2,
          life: 30,
          maxLife: 30,
        });
      }
    }
  } else if (game.currentChar === 'sanae') {
    // 早苗：V字形扇形弹道，无跟踪
    for (let i = 0; i < subCount; i++) {
      const c = game.companions[i];
      if (c) {
        const spread = 0.5;
        [ -spread, spread ].forEach((angleOffset) => {
          game.bullets.push({
            x: c.x, y: c.y,
            radius: CONFIG.SUB_BULLET_RADIUS,
            vx: Math.sin(angleOffset) * CONFIG.BULLET_SPEED,
            vy: -Math.cos(angleOffset) * CONFIG.BULLET_SPEED,
            life: CONFIG.BULLET_LIFE,
            damage: CONFIG.SUB_BULLET_DMG,
            isMain: false,
            noTracking: true,  // 早苗子弹不跟踪
            color: SUB_COLORS[i % SUB_COLORS.length],
          });
        });
      }
    }
  }

  playSound('shoot');
}

/**
 * 更新敌人 — 母敌人巡逻+射击，子敌人下半屏
 */
function updateEnemies() {
  for (let i = game.enemies.length - 1; i >= 0; i--) {
    const e = game.enemies[i];

    // 所有敌人在上半屏来回移动，不靠近玩家
    const upperBound = CONFIG.CANVAS_H * 0.5;
    if (e.y < upperBound) {
      // 下落阶段：向下移动，同时朝屏幕中心横向趋近（防止左右侧生成的敌人一直停在屏幕外）
      e.y += e.speed;
      const centerX = CONFIG.CANVAS_W / 2;
      e.x += (centerX - e.x) * 0.02 * e.speed;
    } else {
      // 到达上半屏下界，改为左右巡逻
      e.y = Math.min(e.y, upperBound);
      if (!e.walkDir) e.walkDir = Math.random() > 0.5 ? 1 : -1;
      e.x += e.walkDir * e.speed;
      // 碰壁换方向
      if (e.x < 20 || e.x > CONFIG.CANVAS_W - 20) {
        e.walkDir *= -1;
      }
    }

    // 蝴蝶：横向摆动叠加
    if (e.type === 'butterfly') {
      e.phase += 0.06;
      e.x += Math.sin(e.phase) * 1.8;
    }

    // 敌人射击 — 按类型不同频率和瞄准方式
    e.shootTimer++;
    const fireIntervals = {
      fuzzy: 120,
      butterfly: 120,
      crow: 80,       // 1.5x fuzzy rate (120/1.5=80)
      mini_boss: 40,  // 3x fuzzy rate (120/3=40)
      big_boss: 80,
    };
    const interval = fireIntervals[e.type] || 120;
    if (e.shootTimer >= interval) {
      e.shootTimer = 0;
      const p = game.player;
      let angle;

      if (e.type === 'fuzzy') {
        // 毛玉：一颗子弹，只往下
        angle = Math.PI / 2;
      } else if (e.type === 'butterfly') {
        // 蝴蝶：一颗子弹，50% 向下，50% 瞄准玩家
        if (Math.random() < 0.5 && p) {
          angle = Math.atan2(p.y - e.y, p.x - e.x);
        } else {
          angle = Math.PI / 2;
        }
      } else if (e.type === 'crow' || e.type === 'mini_boss' || e.type === 'big_boss') {
        // 乌鸦/小boss/大boss：一颗子弹，瞄准玩家附近（带随机偏移）
        if (p) {
          const baseAngle = Math.atan2(p.y - e.y, p.x - e.x);
          angle = baseAngle + (Math.random() - 0.5) * 0.5;
        } else {
          angle = Math.PI / 2;
        }
      } else {
        angle = Math.PI / 2;
      }

      game.enemyBullets.push({
        x: e.x, y: e.y,
        vx: Math.cos(angle) * 3,
        vy: Math.sin(angle) * 3,
        radius: 4,
        color: '#ffcc00',
        life: 180,
      });
      playSound('shoot');
    }

    // 受击闪烁递减
    if (e.hitFlash > 0) e.hitFlash--;

    // 出屏移除（只移除横向出屏的，纵向的上半屏内保留）
    if (e.x < -50 || e.x > CONFIG.CANVAS_W + 50) {
      game.enemies.splice(i, 1);
    }
  }
}

function updateEnemyBullets() {
  for (let i = game.enemyBullets.length - 1; i >= 0; i--) {
    const b = game.enemyBullets[i];
    b.x += b.vx;
    b.y += b.vy;
    b.life--;

    // 子弹出屏或生命结束
    if (b.life <= 0 || b.y > CONFIG.CANVAS_H + 20 || b.y < -20 || b.x < -20 || b.x > CONFIG.CANVAS_W + 20) {
      game.enemyBullets.splice(i, 1);
    }
  }
}

function drawEnemyBullets() {
  for (const b of game.enemyBullets) {
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fill();

    // 发光效果
    ctx.fillStyle = b.color + '44';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius * 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

/**
 * 更新子弹：移动 + 生命周期
 */
function updateBullets() {
  for (let i = game.bullets.length - 1; i >= 0; i--) {
    const b = game.bullets[i];

    // v3.2: 副子弹（不是主子弹，不是Bomb）每帧追踪最近敌人
    // 早苗的 V 字形子弹标记了 noTracking，跳过追踪
    if (!b.isMain && b.damage > 0 && !b.noTracking && game.enemies.length > 0) {
      let nearest = null;
      let minDist = Infinity;
      for (const e of game.enemies) {
        const d = dist(b.x, b.y, e.x, e.y);
        if (d < minDist) {
          minDist = d;
          nearest = e;
        }
      }
      if (nearest) {
        const angle = Math.atan2(nearest.y - b.y, nearest.x - b.x);
        b.vx = Math.cos(angle) * CONFIG.SUB_BULLET_SPEED;
        b.vy = Math.sin(angle) * CONFIG.SUB_BULLET_SPEED;
      }
    }

    b.x += b.vx;
    b.y += b.vy;
    b.life--;
    if (b.life <= 0 ||
        b.x < -50 || b.x > CONFIG.CANVAS_W + 50 ||
        b.y < -50 || b.y > CONFIG.CANVAS_H + 50) {
      game.bullets.splice(i, 1);
    }
  }
}

/**
 * 更新粒子特效
 */
function updateParticles() {
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const pt = game.particles[i];
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.life--;
    if (pt.life <= 0) {
      game.particles.splice(i, 1);
    }
  }
}

/**
 * 敌人被击杀时 — 概率直接 +0.1 Power（v3.3：不生成道具）
 */
function onEnemyKilled(enemy) {
  // 大 boss 不掉落 power
  if (enemy.type === 'big_boss') return;
  if (enemy.type !== 'mini_boss' && Math.random() < CONFIG.POWER_ITEM_DROP_RATE) {
    game.power = Math.min(CONFIG.MAX_POWER, game.power + CONFIG.POWER_PER_ITEM);
    playSound('power');
  }
}

/**
 * 碰撞检测系统（v3）
 *
 * 【子弹 vs 敌人】
 *   主子弹 damage=1，副子弹 damage=0.5，命中后子弹消失。
 *
 * 【敌人 vs 玩家】
 *   扣 40% HP，HP 归零则优先防死（消耗所有 bomb），无 bomb 才失命。
 *
 * 【注】v3.3: Power 道具移除，击杀敌人直接 +0.1 Power
 */
function checkCollisions(now) {
  const p = game.player;
  if (!p) return;

  // ---- 子弹 vs 敌人 ----
  for (let bi = game.bullets.length - 1; bi >= 0; bi--) {
    const b = game.bullets[bi];
    // Bomb 子弹（damage === 0）不参与碰撞
    if (b.damage <= 0) continue;

    let bulletUsed = false;

    for (let ei = game.enemies.length - 1; ei >= 0; ei--) {
      const e = game.enemies[ei];
      if (dist(b.x, b.y, e.x, e.y) < b.radius + e.radius) {
        // 命中：扣血
        e.hp -= b.damage;
        bulletUsed = true;

          if (e.hp <= 0) {
            // 击杀
            const baseScore = ENEMY_SCORES[e.type] || 1;
            game.score += baseScore;
            onEnemyKilled(e);
            createExplosion(e.x, e.y, getEnemyColor(e.type), 8);
            playSound('explosion');
            checkScoreRewards();
            // v5.1: 杀死大 boss → 通关
            if (e.type === 'big_boss') {
              game.state = STATE.CLEAR;
              enterClear();
            }
            game.enemies.splice(ei, 1);
        } else {
          // 受击不掉血，视觉闪烁
          e.hitFlash = 10;
        }
        break; // 一弹一敌
      }
    }

    if (bulletUsed) {
      game.bullets.splice(bi, 1);
    }
  }

  // ---- 敌人 vs 玩家（无敌跳过）----
  if (now >= p.invincibleUntil) {
    for (let ei = game.enemies.length - 1; ei >= 0; ei--) {
      const e = game.enemies[ei];
      if (dist(p.x, p.y, e.x, e.y) < p.radius + e.radius) {
        // 玩家受伤：扣 40% HP
        p.hp -= CONFIG.HP_LOSS;
        p.invincibleUntil = now + CONFIG.DAMAGE_INTERVAL;
        createExplosion(p.x, p.y, '#ff6644', 12);
        playSound('hit');

        // 击退敌人（防止连续伤害）
        const angle = Math.atan2(e.y - p.y, e.x - p.x);
        e.x += Math.cos(angle) * 40;
        e.y += Math.sin(angle) * 40;

        if (p.hp <= 0) {
          // === v3 防死机制 ===
          if (game.bombs > 0) {
            // 有 bomb：触发防死
            triggerDeathSave(now);
          } else {
            // 无 bomb：正常死亡
            game.lives--;
            createExplosion(p.x, p.y, '#ff4444', 30);
            if (game.lives > 0) {
              p.hp = CONFIG.PLAYER_MAX_HP;
              // v3.3: 新生命带 x+2 个 Bomb（不超过上限）
              const bombsAtDeath = game.bombs;
              game.bombs = Math.min(CONFIG.MAX_BOMBS, bombsAtDeath + 2);
            }
          }
        }
        break; // 一帧最多一次受伤
      }
    }
  }

  // ---- 母敌人子弹 vs 玩家 ----
  if (now >= p.invincibleUntil) {
    for (let bi = game.enemyBullets.length - 1; bi >= 0; bi--) {
      const b = game.enemyBullets[bi];
      if (dist(p.x, p.y, b.x, b.y) < p.radius + b.radius) {
        // 玩家受伤
        p.hp -= CONFIG.HP_LOSS;
        p.invincibleUntil = now + CONFIG.DAMAGE_INTERVAL;
        createExplosion(p.x, p.y, '#ff6644', 12);
        playSound('hit');
        game.enemyBullets.splice(bi, 1);

        if (p.hp <= 0) {
          if (game.bombs > 0) {
            triggerDeathSave(now);
          } else {
            game.lives--;
            createExplosion(p.x, p.y, '#ff4444', 30);
            if (game.lives > 0) {
              p.hp = CONFIG.PLAYER_MAX_HP;
              const bombsAtDeath = game.bombs;
              game.bombs = Math.min(CONFIG.MAX_BOMBS, bombsAtDeath + 2);
            }
          }
        }
        break;
      }
    }
  }
}

/**
 * v3: 防死机制 — 消耗所有 bomb，HP=1，无敌，不失命
 */
function triggerDeathSave(now) {
  // 清空所有 bomb
  game.bombs = 0;
  // 玩家获得短暂无敌
  game.player.invincibleUntil = now + CONFIG.BOMB_DEATH_SAVE_INVINCIBLE;
  // HP 回到 1
  game.player.hp = 1;
  // 视觉反馈（爆炸 + 闪白）
  createExplosion(game.player.x, game.player.y, '#ffcc44', 20);
  // 触发防死消息
  game.bonusMessages.push({
    text: 'BOMB SAVE!',
    startTime: now,
  });
  // 启用简化的 Bomb 动画（白闪 + 光环）
  game.isBombActive = true;
  game.bombAnimStartTime = now;
}

// ================================================================
//  十、渲染系统（每帧调用）
// ================================================================

/**
 * 绘制背景（v5.1: 多背景切换）
 */
function drawBackground() {
  const W = CONFIG.CANVAS_W;
  const H = CONFIG.CANVAS_H;

  switch (game.currentBg) {
    case 'beach': drawBeach(W, H); break;
    case 'forest': drawForest(W, H); break;
    case 'grassland': drawGrassland(W, H); break;
    case 'waterfall': drawWaterfall(W, H); break;
    case 'snow': drawSnow(W, H); break;
    default: drawBeach(W, H);
  }
}

function drawBeach(W, H) {
  // 天空
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.6);
  skyGrad.addColorStop(0, '#87ceeb');
  skyGrad.addColorStop(1, '#4da6ff');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H * 0.6);

  // 太阳
  ctx.fillStyle = '#ffdd44';
  ctx.beginPath();
  ctx.arc(W - 80, 60, 40, 0, Math.PI * 2);
  ctx.fill();

  // 云
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  drawCloud(100, 80, 0.8);
  drawCloud(300, 50, 1.0);
  drawCloud(500, 100, 0.6);

  // 沙滩
  ctx.fillStyle = '#f4d03f';
  ctx.fillRect(0, H * 0.6, W, H * 0.15);

  // 海水
  const seaGrad = ctx.createLinearGradient(0, H * 0.75, 0, H);
  seaGrad.addColorStop(0, '#2196f3');
  seaGrad.addColorStop(1, '#0d47a1');
  ctx.fillStyle = seaGrad;
  ctx.fillRect(0, H * 0.75, W, H * 0.25);

  // 波浪
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    for (let x = 0; x < W; x += 5) {
      const y = H * 0.78 + i * 8 + Math.sin((x + game.frameCount * 0.5) * 0.02) * 4;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}

function drawForest(W, H) {
  // 天空
  ctx.fillStyle = '#2d5a27';
  ctx.fillRect(0, 0, W, H);

  // 树干
  ctx.fillStyle = '#5d4037';
  for (let i = 0; i < 8; i++) {
    const tx = i * 110 + 30;
    ctx.fillRect(tx, H * 0.3, 20, H * 0.7);
  }

  // 树冠
  ctx.fillStyle = '#1b5e20';
  for (let i = 0; i < 8; i++) {
    const tx = i * 110 + 40;
    ctx.beginPath();
    ctx.arc(tx, H * 0.3, 50, 0, Math.PI * 2);
    ctx.fill();
  }

  // 地面
  ctx.fillStyle = '#33691e';
  ctx.fillRect(0, H * 0.85, W, H * 0.15);

  // 落叶
  ctx.fillStyle = 'rgba(139, 69, 19, 0.4)';
  for (let i = 0; i < 20; i++) {
    const lx = (i * 43 + game.frameCount * 0.3) % W;
    const ly = (i * 67 + game.frameCount * 0.2) % H;
    ctx.beginPath();
    ctx.arc(lx, ly, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawGrassland(W, H) {
  // 天空
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.5);
  skyGrad.addColorStop(0, '#87ceeb');
  skyGrad.addColorStop(1, '#b0e0e6');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H * 0.5);

  // 云
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  drawCloud(150, 60, 1.0);
  drawCloud(400, 40, 0.7);

  // 草地
  ctx.fillStyle = '#7cb342';
  ctx.fillRect(0, H * 0.5, W, H * 0.5);

  // 小花
  const flowerColors = ['#e91e63', '#ff9800', '#ffeb3b', '#9c27b0'];
  for (let i = 0; i < 15; i++) {
    const fx = i * 55 + 20;
    const fy = H * 0.55 + (i % 3) * 30;
    ctx.fillStyle = flowerColors[i % 4];
    ctx.beginPath();
    ctx.arc(fx, fy, 4, 0, Math.PI * 2);
    ctx.fill();
  }

function drawWaterfall(W, H) {
  // 岩壁
  ctx.fillStyle = '#607d8b';
  ctx.fillRect(0, 0, W, H);

  // 岩石纹理
  ctx.fillStyle = '#455a64';
  for (let i = 0; i < 10; i++) {
    const rx = i * 85 + 10;
    const ry = (i % 2) * 60;
    ctx.fillRect(rx, ry, 60, 40);
  }

  // 瀑布水流
  ctx.fillStyle = 'rgba(33, 150, 243, 0.6)';
  ctx.fillRect(W * 0.4, 0, 60, H);

  // 水花
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  for (let i = 0; i < 8; i++) {
    const wx = W * 0.4 + Math.sin((i + game.frameCount * 0.1) * 0.8) * 20;
    const wy = H * 0.8 + i * 8;
    ctx.beginPath();
    ctx.arc(wx, wy, 5, 0, Math.PI * 2);
    ctx.fill();
  }

  // 底部水潭
  const waterGrad = ctx.createLinearGradient(0, H * 0.85, 0, H);
  waterGrad.addColorStop(0, '#1565c0');
  waterGrad.addColorStop(1, '#0d47a1');
  ctx.fillStyle = waterGrad;
  ctx.fillRect(0, H * 0.85, W, H * 0.25);
}

function drawSnow(W, H) {
  // 天空
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.4);
  skyGrad.addColorStop(0, '#b3e5fc');
  skyGrad.addColorStop(1, '#e1f5fe');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H * 0.4);

  // 雪山
  ctx.fillStyle = '#eceff1';
  ctx.beginPath();
  ctx.moveTo(0, H * 0.6);
  ctx.lineTo(W * 0.2, H * 0.2);
  ctx.lineTo(W * 0.4, H * 0.5);
  ctx.lineTo(W * 0.6, H * 0.15);
  ctx.lineTo(W * 0.8, H * 0.45);
  ctx.lineTo(W, H * 0.55);
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fill();

  // 雪地
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, H * 0.7, W, H * 0.3);

  // 飘雪
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  for (let i = 0; i < 30; i++) {
    const sx = (i * 29 + game.frameCount * 0.2) % W;
    const sy = (i * 41 + game.frameCount * 0.3) % H;
    ctx.beginPath();
    ctx.arc(sx, sy, 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawCloud(x, y, scale) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.beginPath();
  ctx.arc(0, 0, 20, 0, Math.PI * 2);
  ctx.arc(25, 0, 20, 0, Math.PI * 2);
  ctx.arc(50, 0, 20, 0, Math.PI * 2);
  ctx.arc(12, -15, 15, 0, Math.PI * 2);
  ctx.arc(38, -15, 15, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

/**
 * 绘制玩家（v4: 迷你 Q 版头像）
 */
function drawPlayer() {
  const p = game.player;
  if (!p) return;

  const now = performance.now();
  if (now < p.invincibleUntil && Math.floor(now / 100) % 2 === 0) {
    ctx.globalAlpha = 0.4;
  }

  // 身体（小）— bomb 期间金色
  const bodyColor = (game.isBombActive && performance.now() < game.bombEndTime) ? '#ffcc44' : '#ee2233';
  ctx.fillStyle = bodyColor;
  ctx.fillRect(p.x - 6, p.y + 5, 12, 15);

  // 头（大圆，肤色）
  ctx.fillStyle = '#ffeedd';
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
  ctx.fill();

  // 眼睛（大）
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(p.x - 5, p.y - 2, 4, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(p.x + 5, p.y - 2, 4, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // 眼睛高光
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(p.x - 4, p.y - 3, 1.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(p.x + 6, p.y - 3, 1.5, 0, Math.PI * 2);
  ctx.fill();

  // 嘴（微笑）
  ctx.strokeStyle = '#cc6666';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(p.x, p.y + 4, 4, 0.2, Math.PI - 0.2);
  ctx.stroke();

  // 红脸蛋
  ctx.fillStyle = 'rgba(255,150,150,0.4)';
  ctx.beginPath();
  ctx.ellipse(p.x - 9, p.y + 3, 4, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(p.x + 9, p.y + 3, 4, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  // 蝴蝶结
  ctx.fillStyle = '#ff4444';
  ctx.beginPath();
  ctx.moveTo(p.x, p.y - p.radius - 5);
  ctx.lineTo(p.x - 8, p.y - p.radius + 2);
  ctx.lineTo(p.x, p.y - p.radius);
  ctx.lineTo(p.x + 8, p.y - p.radius + 2);
  ctx.closePath();
  ctx.fill();

  ctx.globalAlpha = 1.0;

  // HP 条
  const barW = 40, barH = 4;
  const bx = p.x - barW / 2;
  const by = p.y - p.radius - 18;
  ctx.fillStyle = '#333';
  ctx.fillRect(bx, by, barW, barH);
  ctx.fillStyle = '#ff4444';
  ctx.fillRect(bx, by, barW * (p.hp / p.maxHp), barH);
}

/**
 * 绘制敌人 — 4 种类型区分
 */
function drawEnemies() {
  for (const e of game.enemies) {
    const cfg = ENEMY_TYPES[e.type];
    
    // 受击白色闪烁
    if (e.hitFlash > 0) {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius + 2, 0, Math.PI * 2);
      ctx.fill();
    }
    
    switch (e.type) {
      case 'fuzzy': drawQFuzzy(e); break;
      case 'butterfly': drawQButterfly(e); break;
      case 'crow': drawQCrow(e); break;
      case 'mini_boss': drawQMiniBoss(e); break;
      case 'big_boss': drawQBigBoss(e); break;
      default: drawQFuzzy(e);
    }
  }
}

// Q版毛球怪
function drawQFuzzy(e) {
  const x = e.x, y = e.y, r = e.radius;

  // 高光

  ctx.fill();

  ctx.fill();

  // 小嘴巴

  ctx.lineWidth = 1.5;

  ctx.beginPath();
  ctx.ellipse(x + 8, y + 3, 3, 2, 0, 0, Math.PI * 2);
  ctx.fill();
}

  // 红色眼珠
  ctx.fillStyle = '#ff0000';
  ctx.beginPath();
  ctx.arc(x - 10, y - 4, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x + 14, y - 4, 5, 0, Math.PI * 2);
  ctx.fill();
  
  // 瞳孔
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(x - 9, y - 3, 2.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x + 15, y - 3, 2.5, 0, Math.PI * 2);
  ctx.fill();
  
  // 高光
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(x - 8, y - 5, 1.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x + 16, y - 5, 1.5, 0, Math.PI * 2);
  ctx.fill();
  
  // 嘴巴（邪恶笑）
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(x, y + 10, 10, 0, Math.PI);
  ctx.fill();
  
  // 牙齿
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(x - 8, y + 10);
  ctx.lineTo(x - 5, y + 14);
  ctx.lineTo(x - 2, y + 10);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + 2, y + 10);
  ctx.lineTo(x + 5, y + 14);
  ctx.lineTo(x + 8, y + 10);
  ctx.closePath();
  ctx.fill();
  
  // 腮红
  ctx.fillStyle = 'rgba(255,100,100,0.3)';
  ctx.beginPath();
  ctx.ellipse(x - 22, y + 8, 5, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x + 22, y + 8, 5, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // HP条（大）
  const barW = 80, barH = 6;
  const bx = x - barW / 2;
  const by = y - r - 24;
  ctx.fillStyle = '#333';
  ctx.fillRect(bx, by, barW, barH);
  ctx.fillStyle = '#cc2233';
  ctx.fillRect(bx, by, barW * (e.hp / e.maxHp), barH);
  
  // 名字
  ctx.fillStyle = '#ffddaa';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('大BOSS', x, by - 4);
}

/**
 * 绘制子弹 — v3: 主子弹橙红，副子弹蓝色
 */
function drawBullets() {
  for (const b of game.bullets) {
    // Bomb 子弹特殊颜色（金色），主子弹橙红，副子弹蓝色
    let color;
    if (b.color) {
      color = b.color; // Bomb 子弹
    } else if (b.isMain) {
      color = '#ff6633'; // 主子弹：橙红
    } else {
      color = '#44aaff'; // 副子弹：蓝色
    }

    // 弹体
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fill();
    // 发光
    ctx.fillStyle = color + '44';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius * 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

/**
 * 绘制粒子特效
 */
function drawParticles() {
  for (const pt of game.particles) {
    const alpha = pt.life / pt.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.radius * alpha, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1.0;
}

// ================================================================
//  十一、Bomb 系统
// ================================================================

/**
 * 使用 Bomb
 * 消耗 1 颗，清除全屏敌人（各 +1 分），20 颗金色散弹，无敌
 */
function useBomb() {
  if (game.bombs <= 0 || game.isBombActive) return;

  game.bombs--;
  game.isBombActive = true;
  game.bombAnimStartTime = performance.now();

  // 根据角色设置 bomb 持续时间和类型
  const now = performance.now();
  const p = game.player;
  switch (game.currentChar) {
    case 'reimu':
      game.bombEndTime = now + 7000;  // 7 秒
      game.bombType = 'reimu';
      break;
    case 'marisa':
      game.bombEndTime = now + 5000;  // 5 秒
      game.bombType = 'marisa';
      break;
    case 'sanae':
      game.bombEndTime = now + 3000;  // 3 秒
      game.bombType = 'sanae';
      break;
  }

  // 玩家无敌
  if (p) {
    p.invincibleUntil = game.bombEndTime;
  }

  // 清空范围内的敌人子弹
  if (p) {
    for (let i = game.enemyBullets.length - 1; i >= 0; i--) {
      const b = game.enemyBullets[i];
      let inRange = false;
      if (game.currentChar === 'sanae') {
        inRange = true; // 全屏
      } else if (game.currentChar === 'reimu') {
        // 自身周围圆形范围（半径200）
        if (dist(p.x, p.y, b.x, b.y) < 200) inRange = true;
      } else if (game.currentChar === 'marisa') {
        // 前方矩形范围
        const range = CONFIG.CANVAS_W / 3;
        if (b.y < p.y && Math.abs(b.x - p.x) < range / 2) inRange = true;
      }
      if (inRange) {
        createExplosion(b.x, b.y, '#ffcc44', 4);
        game.enemyBullets.splice(i, 1);
      }
    }
  }

  playSound('bomb');
}

/**
 * v5: C 键转换 — power 转 bomb
 */
function convertPowerToBomb() {
  if (!game.debugMode && game.power < 1) return;
  game.power -= 1;
  game.bombs = Math.min(CONFIG.MAX_BOMBS, game.bombs + 1);
  if (game.debugMode) game.power = 5;  // debug 模式下恢复 power
  game.bonusMessages.push({
    text: '-1 POWER → +1 BOMB',
    startTime: performance.now(),
  });
  if (game.player) {
    createExplosion(game.player.x, game.player.y - 20, '#ffcc44', 8);
  }
  playSound('convert');
}

/**
 * v8: 持续 bomb 效果 — 每秒造成伤害
 */
function updateBombEffect() {
  if (!game.isBombActive) return;
  
  const now = performance.now();
  if (now >= game.bombEndTime) {
    game.isBombActive = false;
    game.bombType = null;
    // bomb结束后额外1秒无敌
    if (game.player) {
      game.player.invincibleUntil = Math.max(game.player.invincibleUntil, now + 1000);
    }
    return;
  }
  
  // 每秒造成伤害
  if (now - game.bombDamageTimer >= 1000) {
    game.bombDamageTimer = now;

    if (game.bombType === 'reimu') {
      // 灵梦：自身周围圆形范围（半径200），每秒1伤害
      const p = game.player;
      if (p) {
        for (let i = game.enemies.length - 1; i >= 0; i--) {
          const e = game.enemies[i];
          if (dist(p.x, p.y, e.x, e.y) < 200) {
            e.hp -= 1;
            if (e.hp <= 0) {
              const baseScore = ENEMY_SCORES[e.type] || 1;
              game.score += baseScore;
              createExplosion(e.x, e.y, getEnemyColor(e.type), 8);
              onEnemyKilled(e);
              game.enemies.splice(i, 1);
            }
          }
        }
        // 连续清除范围内的敌人子弹
        for (let i = game.enemyBullets.length - 1; i >= 0; i--) {
          const b = game.enemyBullets[i];
          if (dist(p.x, p.y, b.x, b.y) < 200) {
            createExplosion(b.x, b.y, '#ffcc44', 3);
            game.enemyBullets.splice(i, 1);
          }
        }
      }
    } else if (game.bombType === 'sanae') {
      // 早苗：全屏爆炸，每秒 1 点
      for (let i = game.enemies.length - 1; i >= 0; i--) {
        const e = game.enemies[i];
        e.hp -= 1;
        if (e.hp <= 0) {
          const baseScore = ENEMY_SCORES[e.type] || 1;
          game.score += baseScore;
          createExplosion(e.x, e.y, getEnemyColor(e.type), 8);
          onEnemyKilled(e);
          game.enemies.splice(i, 1);
        }
      }
      // 全屏爆炸特效
      createExplosion(CONFIG.CANVAS_W / 2, CONFIG.CANVAS_H / 2, '#88ff88', 30);
      // 全屏清除敌人子弹
      for (let i = game.enemyBullets.length - 1; i >= 0; i--) {
        createExplosion(game.enemyBullets[i].x, game.enemyBullets[i].y, '#ffcc44', 3);
      }
      game.enemyBullets = [];
    } else if (game.bombType === 'marisa') {
      // 魔理沙：前方 1/3 屏幕范围伤害
      const range = CONFIG.CANVAS_W / 3;
      const px = game.player.x;
      const py = game.player.y;
      for (let i = game.enemies.length - 1; i >= 0; i--) {
        const e = game.enemies[i];
        if (e.y < py && Math.abs(e.x - px) < range / 2) {
          e.hp -= 1;
          if (e.hp <= 0) {
            const baseScore = ENEMY_SCORES[e.type] || 1;
            game.score += baseScore;
            createExplosion(e.x, e.y, getEnemyColor(e.type), 8);
            onEnemyKilled(e);
            game.enemies.splice(i, 1);
          }
        }
      }
      // 清除前方范围内的敌人子弹
      for (let i = game.enemyBullets.length - 1; i >= 0; i--) {
        const b = game.enemyBullets[i];
        if (b.y < py && Math.abs(b.x - px) < range / 2) {
          createExplosion(b.x, b.y, '#ffcc44', 3);
          game.enemyBullets.splice(i, 1);
        }
      }
    }
  }
}

/**
 * 检查分数奖励
 * 每 500 分 +1 LIFE（上限 10），每 200 分 +1 BOMB（上限 10）
 */
function checkScoreRewards() {
  while (game.score >= game.scoreForNextLife && game.lives < CONFIG.MAX_LIVES) {
    game.lives++;
    game.scoreForNextLife += CONFIG.SCORE_FOR_LIFE;
    game.bonusMessages.push({
      text: '+1 LIFE',
      startTime: performance.now(),
    });
  }

  while (game.score >= game.scoreForNextBomb && game.bombs < CONFIG.MAX_BOMBS) {
    game.bombs++;
    game.scoreForNextBomb += CONFIG.SCORE_FOR_BOMB;
    game.bonusMessages.push({
      text: '+1 BOMB',
      startTime: performance.now(),
    });
  }
}

// ================================================================
//  十二、Bomb 动画渲染
// ================================================================

function drawBombEffect() {
  if (!game.isBombActive) return;
  const p = game.player;
  if (!p) return;

  const now = performance.now();
  const elapsed = now - game.bombAnimStartTime;
  const duration = Math.max(1, game.bombEndTime - game.bombAnimStartTime);
  const progress = Math.min(elapsed / duration, 1);

  // 灵梦：显示圆形范围区域（半径200）
  if (game.bombType === 'reimu' && p) {
    const pulse = 1 + Math.sin(elapsed * 0.01) * 0.1;
    const r = 200 * pulse;
    ctx.fillStyle = 'rgba(255, 150, 50, 0.08)';
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 100, 30, 0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  // 魔理沙：显示前方范围
  if (game.bombType === 'marisa' && p) {
    const range = CONFIG.CANVAS_W / 3;
    ctx.fillStyle = 'rgba(100, 200, 255, 0.1)';
    ctx.fillRect(p.x - range / 2, 0, range, p.y);
    ctx.strokeStyle = 'rgba(100, 200, 255, 0.5)';
    ctx.lineWidth = 2;
    ctx.strokeRect(p.x - range / 2, 0, range, p.y);
  }

  // 早苗：显示全屏爆炸圈
  if (game.bombType === 'sanae') {
    const expandRadius = Math.max(0, ((elapsed % 1000) / 1000) * CONFIG.CANVAS_W);
    ctx.strokeStyle = 'rgba(100, 255, 100, 0.5)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(CONFIG.CANVAS_W / 2, CONFIG.CANVAS_H / 2, expandRadius, 0, Math.PI * 2);
    ctx.stroke();
  }

  // "BOMB!" 文字
  if (progress < 0.5) {
    const textAlpha = Math.max(0, 1 - progress / 0.5);
    ctx.fillStyle = `rgba(255, 200, 50, ${textAlpha})`;
    ctx.font = 'bold 48px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('BOMB!', CONFIG.CANVAS_W / 2, CONFIG.CANVAS_H / 2);
  }
}

// ================================================================
//  十三、浮动奖励提示
// ================================================================

function drawBonusMessages() {
  const p = game.player;
  if (!p) return;
  const now = performance.now();
  for (let i = game.bonusMessages.length - 1; i >= 0; i--) {
    const msg = game.bonusMessages[i];
    const elapsed = now - msg.startTime;
    if (elapsed > 2000) {
      game.bonusMessages.splice(i, 1);
      continue;
    }
    const progress = elapsed / 2000;
    const alpha = 1 - progress;
    const yOffset = -progress * 50;

    ctx.fillStyle = `rgba(255, 204, 68, ${alpha})`;
    ctx.font = 'bold 24px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(msg.text, p.x, p.y + yOffset - 20);
  }
}

// ================================================================
//  十四、状态栏更新
// ================================================================

function updateStatusBar() {
  livesDisplay.textContent = `命: ❤️×${game.lives}`;
  hpDisplay.textContent = `HP: ${game.player ? game.player.hp : 0}/${game.player ? game.player.maxHp : 100}`;

  // v7: bomb 显示改为绿色星星
  bombsDisplay.textContent = `Bomb: ⭐×${game.bombs}`;

  // v7: power 显示，>=4时粗体蓝色
  const powerText = `Power: ${game.power.toFixed(1)}/5.0`;
  if (game.power >= 4) {
    powerDisplay.innerHTML = `<span style="color: #4488ff; font-weight: bold;">${powerText}</span>`;
  } else {
    powerDisplay.textContent = powerText;
  }

  scoreDisplay.textContent = `得分: ${game.score}`;
}

// ================================================================
//  十五、GAME OVER 界面
// ================================================================

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, CONFIG.CANVAS_W, CONFIG.CANVAS_H);

  ctx.fillStyle = '#ff6644';
  ctx.font = 'bold 48px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('GAME OVER', CONFIG.CANVAS_W / 2, CONFIG.CANVAS_H / 3);

  ctx.fillStyle = '#ccaa88';
  ctx.font = '20px "Segoe UI", sans-serif';
  ctx.fillText(`最终得分: ${game.score}`, CONFIG.CANVAS_W / 2, CONFIG.CANVAS_H / 2 + 10);

  ctx.fillStyle = '#aa8866';
  ctx.font = '16px "Segoe UI", sans-serif';
  ctx.fillText('按 R 键重新开始', CONFIG.CANVAS_W / 2, CONFIG.CANVAS_H / 2 + 50);
}

// ================================================================
//  十五-B、通关界面（CLEAR）
// ================================================================

function drawClear() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, CONFIG.CANVAS_W, CONFIG.CANVAS_H);

  ctx.fillStyle = '#ffcc44';
  ctx.font = 'bold 64px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('GAME CLEAR', CONFIG.CANVAS_W / 2, CONFIG.CANVAS_H / 3 - 20);

  ctx.fillStyle = '#ccaa88';
  ctx.font = '20px "Segoe UI", sans-serif';
  ctx.fillText(`最终得分: ${game.score}`, CONFIG.CANVAS_W / 2, CONFIG.CANVAS_H / 2 + 10);
  ctx.fillText(`剩余命数: ${game.lives}`, CONFIG.CANVAS_W / 2, CONFIG.CANVAS_H / 2 + 40);
  ctx.fillText(`最终 Power: ${game.power.toFixed(1)}/5.0`, CONFIG.CANVAS_W / 2, CONFIG.CANVAS_H / 2 + 70);

  ctx.fillStyle = '#aa8866';
  ctx.font = '16px "Segoe UI", sans-serif';
  ctx.fillText('按 R 键重新开始', CONFIG.CANVAS_W / 2, CONFIG.CANVAS_H / 2 + 110);
}

// ================================================================
//  十六、FPS 计算
// ================================================================

function updateFPS(now) {
  game._fpsFrames++;
  if (now - game._fpsLastTime >= 1000) {
    game.fps = game._fpsFrames;
    game._fpsFrames = 0;
    game._fpsLastTime = now;
    fpsDisplay.textContent = `FPS: ${game.fps}`;
  }
}

// ================================================================
//  十七、主游戏循环
// ================================================================

function gameLoop(timestamp) {
  // ---- 步骤 1: FPS ----
  updateFPS(timestamp);

  // ---- 步骤 2: 状态机调度 ----
  updateStateMachine();

  // ---- 步骤 3: 逻辑更新 ----
  if (game.state === STATE.PLAYING) {
    const now = performance.now();

    // v3.2: 动态敌人生成（频率从慢到快线性增长）
    const spawnInterval = getCurrentSpawnInterval();
    if (now - game.lastSpawnTime >= spawnInterval) {
      if (game.enemies.length < CONFIG.ENEMY_MAX) {
        game.enemies.push(createEnemy());
      }
      game.lastSpawnTime = now;
    }

    // 大 boss 强制出场（prob=0 无法随机生成）
    if (game.score >= 1800 && !game.bigBossSpawned) {
      const boss = createEnemy();
      boss.type = 'big_boss';
      const cfg = ENEMY_TYPES.big_boss;
      boss.hp = cfg.hp;
      boss.maxHp = cfg.hp;
      boss.radius = cfg.radius;
      boss.speed = CONFIG.ENEMY_SPEED * cfg.speedMult;
      boss.isBoss = true;
      // 从正上方出现
      boss.x = CONFIG.CANVAS_W / 2;
      boss.y = -cfg.radius - 10;
      game.enemies.push(boss);
      game.bigBossSpawned = true;
    }

    updatePlayer();

    // 自动开火
    if (now - lastFireTime >= CONFIG.AUTO_FIRE_INTERVAL) {
      autoFire(now);
      lastFireTime = now;
    }

    updateEnemies();
    updateBombEffect();
    updateEnemyBullets();
    updateBullets();
    updateParticles();

    // v7: 更新辅助子机和激光
    updateCompanions();
    updateLasers();

    checkCollisions(now);

    game.frameCount++;
  }

  // ---- 步骤 4: 渲染 ----
  drawBackground();
  drawEnemies();
  drawEnemyBullets();
  drawBullets();
  drawParticles();
  drawCompanions();
  drawLasers();
  drawPlayer();
  drawBombEffect();
  drawBonusMessages();

  // 终态叠加
  if (game.state === STATE.GAME_OVER) {
    drawGameOver();
  } else if (game.state === STATE.CLEAR) {
    drawClear();
  } else if (game.state === STATE.PAUSED) {
    // 暂停遮罩
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, CONFIG.CANVAS_W, CONFIG.CANVAS_H);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 36px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('⏸ 暂停', CONFIG.CANVAS_W / 2, CONFIG.CANVAS_H / 2);
    ctx.fillStyle = '#ccaa88';
    ctx.font = '16px "Segoe UI", sans-serif';
    ctx.fillText('按 ESC 继续', CONFIG.CANVAS_W / 2, CONFIG.CANVAS_H / 2 + 40);
  }

  // ---- 步骤 5: 状态栏 ----
  updateStatusBar();

  // ---- 下一帧 ----
  requestAnimationFrame(gameLoop);
}

// ================================================================
//  十八、启动游戏
// ================================================================

game._fpsLastTime = performance.now();
// 初始化 debug 模式（默认开启）
if (document.getElementById('debugToggle').checked) {
  game.debugMode = true;
  game.power = 5;
}
requestAnimationFrame(gameLoop);

console.log('🎮 东方Project 割草游戏 v3 已启动！');
console.log('操作: WASD 移动 | X/空格 Bomb | R 键重新开始');

console.log('子弹: 主子弹damage=1(橙红) + 副子弹damage=0.5×floor(power)(蓝色)');
console.log('敌人: 毛球(0分) | 蝴蝶(500分) | 乌鸦(1000分) | 小boss(1500分)');

console.log('分数: 每敌1分，2000分通关');
console.log('奖励: 每500分+1命(上限10)，每200分+1 Bomb(上限10)');
